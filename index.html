<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · My Social App</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  /* ================================
     RESET & BASE STYLES
     (You already know this from CSS!)
  ================================ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Outfit', sans-serif;
    background: #0f0e17;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ================================
     BACKGROUND BLOBS
     (Decorative blurred circles)
  ================================ */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  .blob-1 {
    width: 400px; height: 400px;
    background: #ff6b6b;
    top: -100px; left: -100px;
    animation: float 8s ease-in-out infinite;
  }

  .blob-2 {
    width: 350px; height: 350px;
    background: #6b63ff;
    bottom: -80px; right: -80px;
    animation: float 10s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-30px); }
  }

  /* ================================
     MAIN CARD
  ================================ */
  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 44px 40px;
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;

    /* Glass effect */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    /* Fade in on load */
    animation: fadeUp 0.5s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ================================
     LOGO / APP NAME
  ================================ */
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-name {
    font-size: 20px;
    font-weight: 800;
    color: white;
    letter-spacing: -0.02em;
  }

  /* ================================
     TAB SWITCHER (Login / Sign Up)
  ================================ */
  .tabs {
    display: flex;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.45);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  /* The active tab has a white background */
  .tab-btn.active {
    background: white;
    color: #0f0e17;
  }

  /* ================================
     FORM FIELDS
  ================================ */
  .form { display: flex; flex-direction: column; gap: 14px; }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.02em;
  }

  .field input {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 13px 16px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    color: white;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  /* Highlight when user clicks into the field */
  .field input:focus {
    border-color: #ff6b6b;
    background: rgba(255,107,107,0.06);
  }

  .field input::placeholder { color: rgba(255,255,255,0.2); }

  /* ================================
     SUBMIT BUTTON
  ================================ */
  .btn-submit {
    margin-top: 6px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    color: white;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-submit:hover  { opacity: 0.9; }
  .btn-submit:active { transform: scale(0.98); }

  /* ================================
     DIVIDER LINE  ("or continue with")
  ================================ */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider hr {
    flex: 1;
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .divider span {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
  }

  /* ================================
     GOOGLE / SOCIAL LOGIN BUTTON
  ================================ */
  .btn-social {
    width: 100%;
    padding: 13px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.75);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    transition: background 0.2s, border-color 0.2s;
  }

  .btn-social:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.2);
  }

  /* ================================
     FOOTER TEXT
  ================================ */
  .footer-text {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
  }

  .footer-text a {
    color: #ff8e53;
    text-decoration: none;
    font-weight: 600;
  }

  /* ================================
     SUCCESS MESSAGE (hidden by default)
  ================================ */
  .success-msg {
    display: none;
    background: rgba(6,214,160,0.1);
    border: 1px solid rgba(6,214,160,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #06d6a0;
    text-align: center;
    margin-top: 14px;
  }

  /* ================================
     PANEL VISIBILITY
     (shows/hides signup-only fields)
  ================================ */
  .signup-only { display: none; }

</style>
</head>
<body>

  <!-- Background decorations -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <!-- Main card -->
  <div class="card">

    <!-- App logo -->
    <div class="logo">
      <div class="logo-icon">🌐</div>
      <div class="logo-name">Vibe</div>
    </div>

    <!-- Tab switcher -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Log In</button>
      <button class="tab-btn"        onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Form -->
    <div class="form">

      <!-- Only shows on Sign Up -->
      <div class="field signup-only">
        <label>Username</label>
        <input type="text" placeholder="e.g. @johndoe" id="username" />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@email.com" id="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" id="password" />
      </div>

      <!-- Only shows on Sign Up -->
      <div class="field signup-only">
        <label>Confirm Password</label>
        <input type="password" placeholder="••••••••" id="confirmPassword" />
      </div>

      <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">
        Log In
      </button>

      <div class="success-msg" id="successMsg"></div>

    </div>

    <!-- Divider -->
    <div class="divider">
      <hr><span>or continue with</span><hr>
    </div>

    <!-- Google button (visual only for now) -->
    <button class="btn-social">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Footer link -->
    <p class="footer-text" id="footerText">
      Don't have an account? <a href="#" onclick="switchTab('signup')">Sign up free</a>
    </p>

  </div>

<script>
  // Track which tab is active
  let currentTab = 'login';

  // ================================
  // SWITCH BETWEEN LOGIN & SIGNUP
  // ================================
  function switchTab(tab) {
    currentTab = tab;

    // Update tab button styles
    const btns = document.querySelectorAll('.tab-btn');
    btns[0].classList.toggle('active', tab === 'login');
    btns[1].classList.toggle('active', tab === 'signup');

    // Show/hide signup-only fields
    const signupFields = document.querySelectorAll('.signup-only');
    signupFields.forEach(f => {
      f.style.display = tab === 'signup' ? 'flex' : 'none';
    });

    // Update button text
    document.getElementById('submitBtn').textContent =
      tab === 'login' ? 'Log In' : 'Create Account';

    // Update footer text
    document.getElementById('footerText').innerHTML = tab === 'login'
      ? 'Don\'t have an account? <a href="#" onclick="switchTab(\'signup\')">Sign up free</a>'
      : 'Already have an account? <a href="#" onclick="switchTab(\'login\')">Log in</a>';

    // Hide any previous success message
    document.getElementById('successMsg').style.display = 'none';
  }

  // ================================
  // HANDLE FORM SUBMIT
  // (fake/demo — no real backend yet)
  // ================================
  function handleSubmit() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('successMsg');

    // Basic validation
    if (!email || !password) {
      msg.style.display = 'block';
      msg.style.background = 'rgba(255,107,107,0.1)';
      msg.style.borderColor = 'rgba(255,107,107,0.3)';
      msg.style.color = '#ff6b6b';
      msg.textContent = '⚠️ Please fill in all fields.';
      return;
    }

    if (currentTab === 'signup') {
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        msg.style.display = 'block';
        msg.style.background = 'rgba(255,107,107,0.1)';
        msg.style.borderColor = 'rgba(255,107,107,0.3)';
        msg.style.color = '#ff6b6b';
        msg.textContent = '⚠️ Passwords don\'t match!';
        return;
      }
      msg.style.display = 'block';
      msg.style.background = 'rgba(6,214,160,0.1)';
      msg.style.borderColor = 'rgba(6,214,160,0.3)';
      msg.style.color = '#06d6a0';
      msg.textContent = '🎉 Account created! (Demo mode — no real data saved yet)';
    } else {
      msg.style.display = 'block';
      msg.style.background = 'rgba(6,214,160,0.1)';
      msg.style.borderColor = 'rgba(6,214,160,0.3)';
      msg.style.color = '#06d6a0';
      msg.textContent = '✅ Logged in! (Demo mode — no real data saved yet)';
    }
  }
</script>

</body>
</html>
